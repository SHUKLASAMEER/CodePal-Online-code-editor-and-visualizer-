<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Learning</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="animation-section" style="padding-top: 120px;">
        <div class="animation-container">
            <div class="animation-title">
                <h2>Debug Learning</h2>
                <p>Testing if everything works.</p>
            </div>

            <!-- Arrays Topic Content -->
            <div class="topic-content active" id="arrays-content">
                <div class="animation-stage">
                    <div class="code-display" id="codeDisplay">
                        <!-- Code lines will be added dynamically -->
                    </div>
                    <div class="array-container" id="arrayContainer">
                        <!-- Array elements will be added dynamically -->
                    </div>
                </div>

                <div class="controls" style="justify-content:center; gap: 12px;">
                    <input id="valueInput" type="number" placeholder="value" style="background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 0.6rem 0.8rem; border-radius: 6px;" />
                    <input id="indexInput" type="number" placeholder="index" style="background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 0.6rem 0.8rem; border-radius: 6px; width: 120px;" />
                    <button id="btnInsert"><i class="fa fa-plus"></i> Insert</button>
                    <button id="btnDelete"><i class="fa fa-trash"></i> Delete</button>
                    <button id="btnUpdate"><i class="fa fa-pen"></i> Update</button>
                    <button id="btnReset"><i class="fa fa-rotate"></i> Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        console.log('Debug script starting...');
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            
            // Test if elements exist
            const codeDisplay = document.getElementById('codeDisplay');
            const arrayContainer = document.getElementById('arrayContainer');
            const valueInput = document.getElementById('valueInput');
            const btnInsert = document.getElementById('btnInsert');
            
            console.log('Elements found:', {
                codeDisplay: !!codeDisplay,
                arrayContainer: !!arrayContainer,
                valueInput: !!valueInput,
                btnInsert: !!btnInsert
            });
            
            // Simple test function
            function testInsert() {
                console.log('Test insert called');
                if (arrayContainer) {
                    arrayContainer.innerHTML = '<div class="array-element active filled"><span class="array-index">0</span><span class="array-value">42</span></div>';
                }
                if (codeDisplay) {
                    codeDisplay.innerHTML = '<div class="code-line"><span class="line-number">01</span><span class="code-text">// Test successful!</span></div>';
                }
            }
            
            // Add event listener
            if (btnInsert) {
                btnInsert.addEventListener('click', testInsert);
                console.log('Event listener added');
            }
            
            // Initialize with some content
            testInsert();
        });
    </script>
</body>
</html>
